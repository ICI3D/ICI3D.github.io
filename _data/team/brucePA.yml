summary: Faikah is the Training Coordinator at SACEMA, Stellenbosch University. She was an MMED participant in 2011, served as an MMED mentor in 2012-2014, and joined the Workshop Faculty in 2015. Between 2018 and 2020, she also served as the ICI3D Program Assistant for Africa, coordinating logistical aspects of the program for African participants and overseeing local logistics for the MMED clinic. She currently serves as the ICI3D Program Manager for the MMED and DAIDD Clinics.
