bio: Njoki Kimani is a Research Fellow at the Centre for Epidemiological Modelling and Analysis (CEMA), University of Nairobi, and a medical doctor and epidemiologist with extensive experience in public health practice. She specialises in applied epidemiological modelling to generate evidence that informs public health policy and decision-making, particularly in infectious disease prevention, control and outbreak preparedness. She has served in various capacities within Kenya’s Ministry of Health, including as an Incident Manager during the COVID-19 pandemic, where she led the coordination of the pandemic response at the sub-national level. Her current work focuses on data-driven evidence generation to inform policies and interventions aimed at improving maternal and child survival in high-burden countries across sub-Saharan Africa. She is also a member of the Ebola modelling team providing technical support to Kenya’s Ministry of Health, using epidemiological modelling to assess the effectiveness of control interventions in preventing disease transmission and further spread.
