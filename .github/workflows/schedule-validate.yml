# Gate schedule DATA edits (#54).
#
# A Jekyll build stays green even when a schedule is wrong, because Liquid renders
# an undefined value or a broken reference as the empty string. This workflow runs
# tools/validate_schedule.py (Tier 0 schema + Tier 1 referential: people keys must
# resolve against _data/team, sessions non-overlapping within a track, end >= start)
# so a bad edit fails a check with a clear, annotated error instead of silently
# shipping a broken page. Make it a REQUIRED status check in branch protection to
# actually gate merges.
name: Validate schedule data

on:
  pull_request:
    paths:
      - '_data/schedule/**'
      - '_data/team/**'          # people data feeds Tier-1 resolution
      - 'schemas/**'
      - 'tools/validate_schedule.py'
      - '.github/workflows/schedule-validate.yml'
  push:
    branches: ['master']
    paths:
      - '_data/schedule/**'
      - '_data/team/**'
      - 'schemas/**'
      - 'tools/validate_schedule.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Validate every cohort schedule
        run: |
          shopt -s nullglob
          files=(_data/schedule/*/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No cohort schedule files under _data/schedule/<clinic>/ — nothing to validate."
            exit 0
          fi
          echo "Validating: ${files[*]}"
          python3 tools/validate_schedule.py "${files[@]}" --github
