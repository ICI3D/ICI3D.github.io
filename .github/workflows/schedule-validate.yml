# Validate this repo's own schedule data (#54) using the shared composite action.
#
# The same action (.github/actions/validate-schedule) is what clinic repos call
# after checking out ICI3D.github.io as a submodule, so the validation logic is
# maintained once here and pulled in everywhere else.
name: Validate schedule data

on:
  pull_request:
    paths:
      - '_data/schedule/**'
      - '_data/team/**'          # people data feeds Tier-1 resolution
      - 'schemas/**'
      - 'tools/validate_schedule.py'
      - '.github/actions/validate-schedule/**'
      - '.github/workflows/schedule-validate.yml'
  push:
    branches: ['master']
    paths:
      - '_data/schedule/**'
      - '_data/team/**'
      - 'schemas/**'
      - 'tools/validate_schedule.py'
      - '.github/actions/validate-schedule/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate-schedule
